<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive QA — Frosted Logic</title>
  <style>
    body { margin: 0; background: #ececf1; color: #161625; font: 15px system-ui, sans-serif; }
    header { padding: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    select, button { font: inherit; padding: 8px; }
    #stage { padding: 16px; overflow: auto; }
    iframe { display: block; height: 850px; border: 1px solid #555; background: #0a0f1e; }
    output { font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <label>Page <select id="page"><option value="../index.html">Homepage</option><option value="../about.html">About</option><option value="../tools.html">Tools</option><option value="../instruments.html">Instruments</option><option value="../games.html">Games</option><option value="../operations-review.html">Operations Review</option><option value="../envcheck.html">EnvCheck</option><option value="../jsonsanity.html">JSONSanity</option><option value="../schemafirst.html">SchemaFirst</option><option value="../glyphscope.html">GlyphScope</option></select></label>
    <label>Width <select id="width"><option>360</option><option>768</option><option>1280</option><option>1440</option></select></label>
    <button id="check" type="button">Check layout</button><output id="result" aria-live="polite">Loading…</output>
  </header>
  <div id="stage"><iframe id="preview" title="Responsive website preview" src="../index.html" width="360"></iframe></div>
  <script>
    const frame = document.getElementById('preview');
    const result = document.getElementById('result');
    const check = () => {
      const root = frame.contentDocument.documentElement;
      const missing = [...frame.contentDocument.images].filter(image => !image.complete || !image.naturalWidth).length;
      const overflow = root.scrollWidth > frame.contentWindow.innerWidth;
      result.value = frame.contentWindow.innerWidth + 'px: ' + (overflow ? 'OVERFLOW' : 'no overflow') + ', ' + missing + ' missing images';
    };
    document.getElementById('width').addEventListener('change', event => {
      frame.width = event.target.value;
      requestAnimationFrame(check);
    });
    document.getElementById('page').addEventListener('change', event => {
      result.value = 'Loading…';
      frame.src = event.target.value;
    });
    document.getElementById('check').addEventListener('click', check);
    frame.addEventListener('load', check);
  </script>
</body>
</html>
